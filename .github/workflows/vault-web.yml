name: DocuVault web (GitHub Pages)
on:
  push:
    branches: [main]
    paths: ['app/**', '.github/workflows/vault-web.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      SERVER: ${{ vars.DOCUVAULT_SERVER || 'https://jainins-server.floot.app' }}
    steps:
      - uses: actions/checkout@v4
      - name: Prepare the site
        run: |
          rm -rf _site && cp -r app _site
          echo "window.DOCUVAULT_SERVER = '$SERVER';" > _site/config.js
          rm -f _site/_headers
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: _site }
      - id: deploy
        uses: actions/deploy-pages@v4
